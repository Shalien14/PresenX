
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Set Password | PresenX</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .password-card {
            background: white;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #0f172a;
        }

        p {
            color: #64748b;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="password-card">
        <h2>Set Your Password</h2>

        <p>
            This is your first login.
            Please create a new password to continue.
        </p>

        <form id="password-form">

            <label for="new-password">
                New Password
            </label>

            <input
                type="password"
                id="new-password"
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <label for="confirm-password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm-password"
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="submit-button">
                Save Password
            </button>

        </form>

        <p id="message" role="status"></p>
    </div>

    <script src="set_password.js"></script>

</body>
</html>
