
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Set Password | PresenX</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background:
                radial-gradient(circle at top right, #18345a 0%, transparent 45%),
                #081321;
            color: #f8fafc;
        }

        .password-card {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background: #101e32;
            border: 1px solid #263c57;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h2 {
            margin: 0 0 12px;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
        }

        p {
            color: #a7b6cc;
            line-height: 1.6;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            background: #1a2c45;
            border: 1px solid #38516f;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .password-card {
                padding: 24px;
            }

            h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="password-card">
        <h2>Set Your Password</h2>

        <p>
            This is your first login.
            Please create a new password to continue.
        </p>

        <form id="password-form">

            <label for="new-password">
                New Password
            </label>

            <input
                type="password"
                id="new-password"
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <label for="confirm-password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm-password"
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="submit-button">
                Save Password
            </button>

        </form>

        <p id="message" role="status"></p>
    </div>

    <script src="set_password.js"></script>

</body>
</html>
