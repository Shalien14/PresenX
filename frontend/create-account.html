
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PresenX | Register Office</title>
    <link rel="stylesheet" href="css/office.css">

</head>
<body>


    <nav class="login-nav">
        <a href="home.html" class="nav-brand">
            <svg viewBox="0 0 24 24">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
            </svg>
            PresenX
        </a>
        <a href="home.html" class="btn-back">
            &larr; Back
        </a>
    </nav>


  <main class="page-container">
    <div class="form-card">
      
      <div class="form-header">
        <span class="pill-badge">
    ORGANIZATION ACCOUNT
</span>

<h2>Create Organisation Account</h2>

<p>
Your organisation has been approved.
Create an administrator account to access PresenX.
</p>
      </div>

      <!-- Feedback / Error Banner -->
      <div id="error-banner" class="alert-box error hidden"></div>
      <div id="success-banner" class="alert-box success hidden"></div>

      <form id="create-account-form">

    <div class="form-group">
        <label class="form-label">Organisation Username</label>
        <input
            type="text"
            id="username"
            class="form-control"
            placeholder="Choose a username"
            required
        >
    </div>

    <div class="form-group">
        <label class="form-label">Password</label>
        <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Enter password"
            required
        >
    </div>

    <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input
            type="password"
            id="confirm-password"
            class="form-control"
            placeholder="Re-enter password"
            required
        >
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-primary">
            Create Account
        </button>
    </div>

</form>

    </div>
  </main>

  <footer class="footer-note">
    PresenX Automated Presence Platform &bull; IoT Telemetry & Vision AI
  </footer>

<script>
const params = new URLSearchParams(window.location.search);
const organisationId = params.get("organisationId");

document
.getElementById("create-account-form")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirm-password").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match");
        return;
    }

    try {

        const response = await fetch(
            "http://localhost:5001/api/create-account",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    organisationId,
                    username,
                    password
                })
            }
        );

        const result = await response.json();

        if (result.success) {

            alert("Account created successfully");

            window.location.href =
                "login.html";

        } else {

            alert(result.message);

        }

    } catch (error) {

        console.error(error);

        alert("Failed to create account");

    }
});
</script>


</body>
</html>
