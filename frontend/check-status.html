<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Registration Status</title>
     <link rel="stylesheet" href="css/employee.css">
</head>

<body>

     <nav class="login-nav">
    <a href="home.html" class="nav-brand">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      PresenX
    </a>
    
  </nav>


    <main class="login-container">
        <div class="login-card">
            <div class="login-header">
               <h1>Check Registration Status</h1>
            </div>

    <form id="status-form">

    <div class="form-group">
        <label class="form-label" for="registration-number">
            Registration Number
        </label>
        <input
            class="form-control"
            type="text"
            id="registration-number"
            placeholder="Enter Registration Number"
            required
        >
    </div>

    <p id="status-message"></p>

    <button type="submit" class="btn-submit">
        Check Status
    </button>

</form>

<div id="status-result"></div>
    </div>
</div>
    </main>


    <footer>
    Smart Presence Telemetry • Official Restricted Console
  </footer>

  <script>

function showReason() {
    const box = document.getElementById("reason-box");

    if (box) {
        box.style.display =
            box.style.display === "none"
                ? "block"
                : "none";
    }
}
    
document.getElementById("status-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const regNo = document.getElementById("registration-number").value;
    const resultDiv = document.getElementById("status-result");

    try {

        const response = await fetch(
            `http://localhost:5001/api/status/${regNo}`
        );

        const data = await response.json();

        let extraHtml = "";
        let badgeClass = "";
        let badgeText = "";

        const accountCreated = Number(data.account_created);

        if (data.status === "accepted") {

            badgeClass = "accepted";
            badgeText = "✅ APPLICATION APPROVED";

            if (accountCreated === 0) {

                extraHtml = `
                    <a href="create-account.html?organisationId=${data.id}"
                       class="btn-submit">
                        Create Organisation Account →
                    </a>
                `;

            } else {

                extraHtml = `
                    <p style="color:#5df287;font-weight:bold;">
                        ✅ Account Already Created
                    </p>
                `;
            }

        } else if (data.status === "pending") {

            badgeClass = "pending";
            badgeText = "🟡 UNDER REVIEW";

            extraHtml = `
                <p class="status-message">
                    Your application is currently being reviewed.
                    Please check again later.
                </p>
            `;

        } else if (data.status === "rejected") {

            badgeClass = "rejected";
            badgeText = "❌ APPLICATION REJECTED";

            extraHtml = `
                <button class="btn-submit" onclick="showReason()">
                    View Rejection Reason
                </button>

                <div id="reason-box"
                     style="display:none;margin-top:15px;">
                    ${data.rejection_reason || "No reason provided."}
                </div>
            `;
        }

        resultDiv.innerHTML = `
            <div class="status-card">

                <div class="status-badge ${badgeClass}">
                    ${badgeText}
                </div>

                <h2>${data.office_name}</h2>

                <p class="status-message">
                    Registration Number: ${data.registration_no}
                </p>

                ${extraHtml}

            </div>
        `;

    } catch (error) {

        resultDiv.innerHTML =
            "<p style='color:red;'>Failed to fetch status.</p>";

        console.error(error);
    }
});
</script>
</body>

</html>
