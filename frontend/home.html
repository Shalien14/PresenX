<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Presence - Don't Make an Unnecessary Trip</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="hero-wrapper">

    <section class="hero-card">
        <!-- Top Pill Badge -->
        <div class="hero-badge">
            <span class="pulse-dot"></span>
            PRESENX LIVE DIRECTORY
        </div>

        <!-- Main Headings -->
        <h1 class="hero-title">Don't Make an Unnecessary Trip.</h1>

        <p class="hero-desc">
            Check official availability before you visit.
            Real-time information. Better planning. Less waiting.
        </p>

        <div class="hero-btn-group">

            <div class="custom-dropdown" id="office-dropdown">

                <button
                    type="button"
                    class="btn-cta-secondary dropdown-trigger"
                    id="dropdown-btn">
                    <span id="selected-text">Select an Office...</span>
                </button>

                <div class="dropdown-menu" id="dropdown-menu"></div>

            </div>

            <button id="check-btn" class="btn-cta-primary" disabled>
                Check Official Availability Now
            </button>

        </div>

        <div class="office-signup-action">
  <span>Representing a public authority or department?</span>
  <a href="office.html" class="btn-register-link">Register New Office &rarr;</a>
</div>


        <!-- Subtitle Note -->
        <div class="hero-footer-text">
            Smart Presence Monitoring System • IoT Sensors & Vision Recognition
        </div>

    </section>

    <script>
        const dropdownBtn = document.getElementById("dropdown-btn");
        const dropdownMenu = document.getElementById("dropdown-menu");
        const selectedText = document.getElementById("selected-text");
        const checkBtn = document.getElementById("check-btn");

        // Open / close dropdown
        dropdownBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle("show");
        });

        // Load organisations
        async function loadOffices() {
            try {
                const response = await fetch(
                    "http://localhost:5001/api/organisations/approved"
                );

                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }

                const data = await response.json();

                console.log("API Response:", data);

                dropdownMenu.innerHTML = "";

                data.organisations.forEach((org) => {
                    const item = document.createElement("div");

                    item.className = "dropdown-item";
                    item.textContent = org.office_name;

                    item.addEventListener("click", () => {
                        selectedText.textContent = org.office_name;

                        dropdownMenu.classList.remove("show");

                        checkBtn.disabled = false;

                        sessionStorage.setItem(
                            "selectedOrganisationId",
                            org.id
                        );

                        sessionStorage.setItem(
                            "selectedOrganisationName",
                            org.office_name
                        );
                    });

                    dropdownMenu.appendChild(item);
                });

                console.log(
                    "Dropdown items:",
                    dropdownMenu.children.length
                );

            } catch (error) {
                console.error("Load offices error:", error);
            }
        }

        // Load when page opens
        document.addEventListener("DOMContentLoaded", () => {
            loadOffices();
        });

        // Close dropdown when clicking outside
        document.addEventListener("click", () => {
            dropdownMenu.classList.remove("show");
        });

        // Navigate
        checkBtn.addEventListener("click", () => {
            const orgId = sessionStorage.getItem(
                "selectedOrganisationId"
            );

            if (!orgId) {
                alert("Please select an office.");
                return;
            }

            window.location.href =
                `index.html?organisation=${orgId}`;
        });
    </script>

</body>
</html>
