</head>

<body>

    <main class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Add Employee</h1>
            </div>

    <form id="forms">
        <div class = "form-group">
        <label class="form-label" for="EmployeeID" >EmployeeID</label>
        <input class="form-control" type="text" id="EmployeeID" required>
        </div>

         <div class = "form-group">
        <label class="form-label" for="EmployeeImage">EmployeeImage</label>
        <input class="form-control" id="image" type="file" name="EmployeeImage" accept="image/*">
        </div>

         <div class = "form-group">
        <label class="form-label" for="EmployeeName">EmployeeName</label>
        <input class="form-control" type="text">
        </div>

         <div class = "form-group">
        <label class="form-label" for="designation">Designation</label>
        <input class="form-control" type="text">
        </div>

        <div class = "form-group">
        <label class="form-label" for="Department">Department</label>
        <input class="form-control" type="text">
        </div>

        <div class = "form-group">
        <label class="form-label" for="Room">Room</label>
        <input class="form-control" type="text">
        </div>

        <button type="submit" id="submit" class="btn-submit">Submit</button>
    </form>
    </div>
</div>
    </main>


    <footer>
    Smart Presence Telemetry • Official Restricted Console
  </footer>
